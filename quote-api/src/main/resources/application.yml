server:
  port: 8080

spring:
  application:
    name: quote-api
  datasource:
    url: ${QUOTE_API_DB_URL:jdbc:postgresql://localhost:5432/quotes}
    username: ${QUOTE_API_DB_USERNAME:quotes}
    password: ${QUOTE_API_DB_PASSWORD:quotes}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

quote:
  outbox:
    poll-interval-ms: ${QUOTE_OUTBOX_POLL_INTERVAL_MS:1000}
